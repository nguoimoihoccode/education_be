[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "assessment-worker"
version = "0.1.0"
description = "Assessment grading worker — Python replacement for the Node pipeline"
requires-python = ">=3.11"
dependencies = [
  "asyncpg>=0.29",
  "boto3>=1.34",
  "httpx>=0.27",
  "pillow>=10",
  "jsonschema>=4.20",
  "reportlab>=4",
  "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
