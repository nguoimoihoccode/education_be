services:
  db:
    # Not the official image: it has no pgvector, and `CREATE EXTENSION vector`
    # (migration 189) fails without it. Built from docker/postgres/Dockerfile,
    # which compiles pgvector against the image's own pg_config. Still alpine on
    # purpose — same libc and same Postgres 16.4 as before, so the existing
    # `pgdata` volume keeps working with no dump/restore.
    image: ${DB_IMAGE}:${DB_IMAGE_TAG}
    container_name: stockvn-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - stockvn-network
      - assessment-data-net
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7.4-alpine
    container_name: stockvn-redis
    restart: unless-stopped
    command:
      [
        "redis-server",
        "--save",
        "",
        "--appendonly",
        "no",
        "--maxmemory",
        "64mb",
        "--maxmemory-policy",
        "allkeys-lru",
      ]
    tmpfs:
      - /data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - stockvn-network
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    image: ${BACKEND_IMAGE}:${IMAGE_TAG}
    container_name: stockvn-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env.prod
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      TRUST_PROXY_HOPS: "1"
      DB_HOST: db
      DB_PORT: "5432"
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_DATABASE: ${POSTGRES_DB}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      ASSESSMENT_ENABLED: ${ASSESSMENT_ENABLED:-false}
      ASSESSMENT_EXTERNAL_GRADING_ENABLED: ${ASSESSMENT_EXTERNAL_GRADING_ENABLED:-false}
      ASSESSMENT_EXTERNAL_GRADING_POLICY: ${ASSESSMENT_EXTERNAL_GRADING_POLICY:-}
      ASSESSMENT_EXTERNAL_GRADING_ASSESSMENT_IDS: ${ASSESSMENT_EXTERNAL_GRADING_ASSESSMENT_IDS:-}
      ASSESSMENT_QUEUE_REDIS_URL: ${ASSESSMENT_QUEUE_REDIS_URL:-}
      ASSESSMENT_STORAGE_DRIVER: ${ASSESSMENT_STORAGE_DRIVER:-s3}
      ASSESSMENT_S3_ENDPOINT: ${ASSESSMENT_S3_ENDPOINT:-}
      ASSESSMENT_S3_REGION: ${ASSESSMENT_S3_REGION:-}
      ASSESSMENT_S3_BUCKET: ${ASSESSMENT_S3_BUCKET:-}
      ASSESSMENT_S3_ACCESS_KEY_ID: ${ASSESSMENT_S3_ACCESS_KEY_ID:-}
      ASSESSMENT_S3_SECRET_ACCESS_KEY: ${ASSESSMENT_S3_SECRET_ACCESS_KEY:-}
      ASSESSMENT_S3_FORCE_PATH_STYLE: ${ASSESSMENT_S3_FORCE_PATH_STYLE:-false}
      ASSESSMENT_ROUTING_CONFIG_PATH: ${ASSESSMENT_ROUTING_CONFIG_PATH:-}
    volumes:
      - ./keys:/app/keys:ro
      - ${ASSESSMENT_CONFIG_DIR:-./assessment-config}:/app/assessment-config:ro
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', (r) => r.statusCode === 200 ? process.exit(0) : process.exit(1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - stockvn-network
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    image: ${FRONTEND_IMAGE}:${IMAGE_TAG}
    container_name: stockvn-frontend
    restart: unless-stopped
    ports:
      # 8080 on this VPS belongs to the nexus-agent frontend. Bind the SPA to
      # 8090 instead; the host nginx vhost and the deploy health checks follow.
      - "8090:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - stockvn-network
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Explicit --profile assessment AND ASSESSMENT_ENABLED=true are required.
  # This durable queue is independent of the disposable cache Redis above.
  assessment-redis:
    image: redis:7.4-alpine
    profiles: [assessment]
    restart: unless-stopped
    command: [redis-server, --appendonly, "yes", --appendfsync, everysec, --maxmemory, 256mb, --maxmemory-policy, noeviction]
    volumes:
      - assessment-redis-data:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 10s
      timeout: 3s
      retries: 5
    mem_limit: 512m
    cpus: "0.50"
    init: true
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    networks:
      - stockvn-network
      - assessment-data-net
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  assessment-inference:
    build:
      context: ./assessment-inference
    image: ${ASSESSMENT_INFERENCE_IMAGE:-stock-assessment-inference}:${IMAGE_TAG:-latest}
    profiles: [assessment]
    restart: unless-stopped
    env_file:
      - path: ${ASSESSMENT_INFERENCE_ENV_FILE:-./.env.assessment-inference}
        required: false
    environment:
      ASSESSMENT_INFERENCE_MODE: local
    read_only: true
    mem_limit: 512m
    cpus: "0.50"
    pids_limit: 64
    init: true
    stop_grace_period: 100s
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    healthcheck:
      test: [CMD, python, -c, "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/healthz', timeout=2).close()"]
      interval: 15s
      timeout: 4s
      retries: 3
    networks:
      - assessment-inference-net
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Manually activated after the approved outbound policy has been verified.
  # The same image is published by CI. This entry point exposes text grading only.
  assessment-external-grading:
    image: ${ASSESSMENT_INFERENCE_IMAGE:-stock-assessment-inference}:${IMAGE_TAG:-latest}
    profiles: [assessment-external]
    restart: unless-stopped
    command: [uvicorn, "external_grading:app", --host, "0.0.0.0", --port, "8000", --no-access-log, --no-proxy-headers, --limit-concurrency, "8"]
    env_file:
      - path: ${ASSESSMENT_EXTERNAL_GRADING_ENV_FILE:-./.env.assessment-external-grading}
        required: false
    read_only: true
    mem_limit: 256m
    cpus: "0.50"
    pids_limit: 64
    init: true
    stop_grace_period: 100s
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    healthcheck:
      test: [CMD, python, -c, "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/healthz', timeout=2).close()"]
      interval: 15s
      timeout: 4s
      retries: 3
    networks:
      - assessment-external-grading-net
      - assessment-external-egress-net
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  assessment-worker:
    build:
      context: .
      dockerfile: Dockerfile.assessment-worker
    image: ${ASSESSMENT_WORKER_IMAGE:-stock-assessment-worker}:${IMAGE_TAG:-latest}
    profiles: [assessment]
    restart: unless-stopped
    env_file:
      - path: ${ASSESSMENT_WORKER_ENV_FILE:-./.env.assessment-worker}
        required: false
    depends_on:
      db:
        condition: service_healthy
      assessment-redis:
        condition: service_healthy
      assessment-inference:
        condition: service_healthy
    environment:
      NODE_ENV: production
      ALLOW_DB_SYNC: "false"
      DB_HOST: db
      DB_PORT: "5432"
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_DATABASE: ${POSTGRES_DB}
      ASSESSMENT_ENABLED: ${ASSESSMENT_ENABLED:-false}
      ASSESSMENT_EXTERNAL_GRADING_ENABLED: ${ASSESSMENT_EXTERNAL_GRADING_ENABLED:-false}
      ASSESSMENT_EXTERNAL_GRADING_POLICY: ${ASSESSMENT_EXTERNAL_GRADING_POLICY:-}
      ASSESSMENT_EXTERNAL_GRADING_ASSESSMENT_IDS: ${ASSESSMENT_EXTERNAL_GRADING_ASSESSMENT_IDS:-}
      ASSESSMENT_QUEUE_REDIS_URL: ${ASSESSMENT_QUEUE_REDIS_URL:-}
      ASSESSMENT_STORAGE_DRIVER: ${ASSESSMENT_STORAGE_DRIVER:-s3}
      ASSESSMENT_S3_ENDPOINT: ${ASSESSMENT_S3_ENDPOINT:-}
      ASSESSMENT_S3_REGION: ${ASSESSMENT_S3_REGION:-}
      ASSESSMENT_S3_BUCKET: ${ASSESSMENT_S3_BUCKET:-}
      ASSESSMENT_S3_ACCESS_KEY_ID: ${ASSESSMENT_S3_ACCESS_KEY_ID:-}
      ASSESSMENT_S3_SECRET_ACCESS_KEY: ${ASSESSMENT_S3_SECRET_ACCESS_KEY:-}
      ASSESSMENT_S3_FORCE_PATH_STYLE: ${ASSESSMENT_S3_FORCE_PATH_STYLE:-false}
      ASSESSMENT_ROUTING_CONFIG_PATH: ${ASSESSMENT_ROUTING_CONFIG_PATH:-}
      ASSESSMENT_INFERENCE_URL: http://assessment-inference:8000
      ASSESSMENT_WORKSPACE_PATH: /app/workspace
      ASSESSMENT_WORKER_HEARTBEAT_PATH: /app/workspace/heartbeat
      # Empty keeps the Node worker on every stage. A cutover narrows this to
      # the stages the Python worker does not claim. Node always owns DOCX template jobs.
      ASSESSMENT_WORKER_STAGES: ${ASSESSMENT_WORKER_STAGES:-}
      ASSESSMENT_JOB_CONCURRENCY: "1"
      ASSESSMENT_PROVIDER_CONCURRENCY: "2"
    volumes:
      - assessment-workspace:/app/workspace
      - ${ASSESSMENT_CONFIG_DIR:-./assessment-config}:/app/assessment-config:ro
    read_only: true
    # Small process temp only; PDF/image work goes on the disk volume.
    tmpfs:
      - /tmp:size=64m,mode=1777
    mem_limit: 2g
    cpus: "1.0"
    pids_limit: 128
    init: true
    stop_grace_period: 120s
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    healthcheck:
      test: [CMD, node, -e, "try { const p = process.env.ASSESSMENT_WORKER_HEARTBEAT_PATH; process.exit(Date.now() - require('fs').statSync(p).mtimeMs < 120000 ? 0 : 1); } catch { process.exit(1); }"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    networks:
      - assessment-data-net
      - assessment-inference-net
      - assessment-external-grading-net
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Python worker. It claims only the stages named in
  # ASSESSMENT_WORKER_PYTHON_STAGES (empty by default, so it claims nothing).
  # A cutover sets that list here and removes the same stages from the Node
  # worker's ASSESSMENT_WORKER_STAGES; the two never claim one stage, because
  # both filter on school_assessment_jobs.stage.
  # Its own workspace volume: the stale-directory sweep must never walk the
  # other worker's job directories.
  assessment-worker-py:
    build:
      context: .
      dockerfile: assessment-worker/Dockerfile
    image: ${ASSESSMENT_WORKER_PY_IMAGE:-stock-assessment-worker-py}:${IMAGE_TAG:-latest}
    profiles: [assessment]
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_DATABASE: ${POSTGRES_DB}
      ASSESSMENT_ENABLED: ${ASSESSMENT_ENABLED:-false}
      ASSESSMENT_WORKER_PYTHON_STAGES: ${ASSESSMENT_WORKER_PYTHON_STAGES:-}
      ASSESSMENT_WORKER_DB_POOL: ${ASSESSMENT_WORKER_DB_POOL:-4}
      ASSESSMENT_S3_ENDPOINT: ${ASSESSMENT_S3_ENDPOINT:-}
      ASSESSMENT_S3_REGION: ${ASSESSMENT_S3_REGION:-}
      ASSESSMENT_S3_BUCKET: ${ASSESSMENT_S3_BUCKET:-}
      ASSESSMENT_S3_ACCESS_KEY_ID: ${ASSESSMENT_S3_ACCESS_KEY_ID:-}
      ASSESSMENT_S3_SECRET_ACCESS_KEY: ${ASSESSMENT_S3_SECRET_ACCESS_KEY:-}
      ASSESSMENT_S3_FORCE_PATH_STYLE: ${ASSESSMENT_S3_FORCE_PATH_STYLE:-false}
    volumes:
      - assessment-workspace-py:/app/workspace
    read_only: true
    # Same contract as the Node worker: a small process temp, bulk work on
    # the workspace volume (the image points TMPDIR there).
    tmpfs:
      - /tmp:size=64m,mode=1777
    mem_limit: 2g
    cpus: "1.0"
    pids_limit: 128
    init: true
    stop_grace_period: 120s
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    healthcheck:
      test: [CMD, python, -c, "import os,sys,time; p=os.environ['ASSESSMENT_WORKER_HEARTBEAT_PATH']; sys.exit(0 if time.time()-os.stat(p).st_mtime<120 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    networks:
      - assessment-data-net
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  stockvn-network:
    driver: bridge
  assessment-data-net:
    driver: bridge
    internal: true
  assessment-inference-net:
    driver: bridge
    internal: true
  assessment-external-grading-net:
    driver: bridge
    internal: true
  # Apply the host egress policy to this bridge before enabling the profile.
  assessment-external-egress-net:
    driver: bridge

volumes:
  pgdata:
  assessment-redis-data:
  assessment-workspace:
  assessment-workspace-py:
