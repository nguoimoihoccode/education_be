name: Deploy Backend

on:
  push:
    branches:
      - main
      - phuc_v2026
  workflow_dispatch:

concurrency:
  group: production-deploy-backend
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/${{ github.repository }}

jobs:
  quality-gate:
    name: Quality gate
    uses: ./.github/workflows/ci.yml

  build-and-push:
    name: Build and push backend image
    needs: quality-gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
            ${{ env.BACKEND_IMAGE }}:latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

  deploy:
    name: Deploy backend to VPS
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      contents: read
    environment:
      name: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Copy production compose
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: docker-compose.prod.yml
          target: ${{ secrets.VPS_APP_DIR }}

      - name: Deploy services
        uses: appleboy/ssh-action@v1.2.0
        env:
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BACKEND_IMAGE: ${{ env.BACKEND_IMAGE }}
          IMAGE_TAG: ${{ github.sha }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: GHCR_USERNAME,GHCR_TOKEN,BACKEND_IMAGE,IMAGE_TAG
          script: |
            set -euo pipefail
            cd "${{ secrets.VPS_APP_DIR }}"
            test -f .env.prod

            previous_tag=""
            if [ -f .last-backend-tag ]; then
              previous_tag="$(cat .last-backend-tag)"
            fi

            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin
            export BACKEND_IMAGE IMAGE_TAG
            docker compose -f docker-compose.prod.yml --env-file .env.prod pull db backend

            db_psql() {
              docker compose -f docker-compose.prod.yml --env-file .env.prod exec -T db \
                sh -c 'psql -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" -tA'
            }

            # This database predates TypeORM's migration history: its schema was
            # built outside the migration runner, so `migrations` is empty and the
            # runner replays from 1700000000000, dying on a column that already
            # exists. Record the pre-school migrations as applied once -- they are
            # already reflected in the schema -- so the runner applies only what is
            # genuinely new. Guarded on an empty history AND a schema probe, so it
            # cannot fire against a database that does not need it.
            baseline_migrations() {
              db_psql <<'SQL'
            CREATE TABLE IF NOT EXISTS "migrations" (
              "id" SERIAL NOT NULL,
              "timestamp" bigint NOT NULL,
              "name" character varying NOT NULL,
              CONSTRAINT "PK_8c82d7f526340ab734260ea46be" PRIMARY KEY ("id")
            );
            SQL

              local applied
              applied="$(db_psql <<'SQL' | tr -d '[:space:]'
            SELECT count(*) FROM "migrations";
            SQL
            )"
              if [ "$applied" != "0" ]; then
                echo "Migration history already present ($applied rows); skipping baseline."
                return 0
              fi

              local probe
              probe="$(db_psql <<'SQL' | tr -d '[:space:]'
            SELECT to_regclass('public.auth_login_attempts') IS NOT NULL;
            SQL
            )"
              if [ "$probe" != "t" ]; then
                echo "Refusing to baseline: no auth_login_attempts table, so this schema is older than migration 1830000000000 and baselining would hide real work." >&2
                return 1
              fi

              echo "Empty migration history on an existing schema; baselining migrations up to 1830000000000."
              db_psql <<'SQL'
            INSERT INTO "migrations" ("timestamp", "name") VALUES
              (1700000000000, 'AddPhoneToUsers1700000000000'),
              (1770000000000, 'AddFlashcardSchema1770000000000'),
              (1770000000001, 'AddTopicToFlashcardDecks1770000000001'),
              (1770000000002, 'AddQuizSchema1770000000002'),
              (1770000000003, 'AddDescriptionToFlashcards1770000000003'),
              (1780000000000, 'AddQuizSessionQuestionOrder1780000000000'),
              (1780000000001, 'AddDailyLearningTasks1780000000001'),
              (1790000000000, 'AddRefreshTokenSessionMetadata1790000000000'),
              (1800000000000, 'AddEducationPlatformApis1800000000000'),
              (1800000000001, 'AddLeaderboardAggregateIndexes1800000000001'),
              (1810000000000, 'AddAiTutorConversations1810000000000'),
              (1820000000000, 'AddAiSystemRules1820000000000'),
              (1830000000000, 'AddAuthLoginAttempts1830000000000')
            ON CONFLICT DO NOTHING;
            SQL
            }

            baseline_migrations

            # Apply pending migrations with the newly built image while the old
            # backend is still serving. The app does not run migrations on boot
            # (no migrationsRun), so without this the new code meets an old schema.
            # Migrations are additive, so a rollback never reverts them.
            docker compose -f docker-compose.prod.yml --env-file .env.prod run --rm -T --no-deps backend npm run migration:run:prod

            docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --remove-orphans db backend
            docker compose -f docker-compose.prod.yml --env-file .env.prod restart frontend || true

            wait_healthy() {
              for _ in $(seq 1 30); do
                curl --fail --show-error --silent http://127.0.0.1:8080/api/health && return 0
                sleep 5
              done
              return 1
            }

            rollback() {
              if [ -z "$previous_tag" ]; then
                echo "Health check failed and no previous tag exists for rollback." >&2
                docker compose -f docker-compose.prod.yml --env-file .env.prod ps
                exit 1
              fi

              echo "Health check failed. Rolling back to $previous_tag." >&2
              export IMAGE_TAG="$previous_tag"
              docker compose -f docker-compose.prod.yml --env-file .env.prod pull backend
              docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --remove-orphans backend
              docker compose -f docker-compose.prod.yml --env-file .env.prod restart frontend || true
              wait_healthy
              exit 1
            }

            wait_healthy || rollback

            printf '%s' "$IMAGE_TAG" > .last-backend-tag
            docker image prune -f --filter "until=168h"
            docker compose -f docker-compose.prod.yml --env-file .env.prod ps