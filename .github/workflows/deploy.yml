name: Deploy Backend

on:
  push:
    branches:
      - main
      - phuc_v2026
  workflow_dispatch:

concurrency:
  group: production-deploy-backend
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/${{ github.repository }}

jobs:
  quality-gate:
    name: Quality gate
    uses: ./.github/workflows/ci.yml

  build-and-push:
    name: Build and push backend image
    needs: quality-gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
            ${{ env.BACKEND_IMAGE }}:latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

  deploy:
    name: Deploy backend to VPS
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      contents: read
    environment:
      name: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Copy production compose
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: docker-compose.prod.yml
          target: ${{ secrets.VPS_APP_DIR }}

      - name: Deploy services
        uses: appleboy/ssh-action@v1.2.0
        env:
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BACKEND_IMAGE: ${{ env.BACKEND_IMAGE }}
          IMAGE_TAG: ${{ github.sha }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: GHCR_USERNAME,GHCR_TOKEN,BACKEND_IMAGE,IMAGE_TAG
          script: |
            set -euo pipefail
            cd "${{ secrets.VPS_APP_DIR }}"
            test -f .env.prod

            previous_tag=""
            if [ -f .last-backend-tag ]; then
              previous_tag="$(cat .last-backend-tag)"
            fi

            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin
            export BACKEND_IMAGE IMAGE_TAG
            docker compose -f docker-compose.prod.yml --env-file .env.prod pull db backend

            # Apply pending migrations with the newly built image while the old
            # backend is still serving. The app does not run migrations on boot
            # (no migrationsRun), so without this the new code meets an old schema.
            # Migrations are additive, so a rollback never reverts them.
            docker compose -f docker-compose.prod.yml --env-file .env.prod run --rm -T --no-deps backend npm run migration:run:prod

            docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --remove-orphans db backend
            docker compose -f docker-compose.prod.yml --env-file .env.prod restart frontend || true

            wait_healthy() {
              for _ in $(seq 1 30); do
                curl --fail --show-error --silent http://127.0.0.1:8080/api/health && return 0
                sleep 5
              done
              return 1
            }

            rollback() {
              if [ -z "$previous_tag" ]; then
                echo "Health check failed and no previous tag exists for rollback." >&2
                docker compose -f docker-compose.prod.yml --env-file .env.prod ps
                exit 1
              fi

              echo "Health check failed. Rolling back to $previous_tag." >&2
              export IMAGE_TAG="$previous_tag"
              docker compose -f docker-compose.prod.yml --env-file .env.prod pull backend
              docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --remove-orphans backend
              docker compose -f docker-compose.prod.yml --env-file .env.prod restart frontend || true
              wait_healthy
              exit 1
            }

            wait_healthy || rollback

            printf '%s' "$IMAGE_TAG" > .last-backend-tag
            docker image prune -f --filter "until=168h"
            docker compose -f docker-compose.prod.yml --env-file .env.prod ps