name: Deploy Backend

# Deployment happens from phuc_v2026 ONLY. Feature branches are built by ci.yml
# but never deployed: merge into phuc_v2026 (through a PR) and that push is what
# ships. Adding a branch here means that branch ships to production directly,
# which is exactly what this list is meant to prevent -- do not add one.
on:
  push:
    branches:
      - phuc_v2026
  workflow_dispatch:

concurrency:
  group: production-deploy-backend
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/${{ github.repository }}
  ASSESSMENT_WORKER_IMAGE: ghcr.io/${{ github.repository }}-assessment-worker
  ASSESSMENT_WORKER_PY_IMAGE: ghcr.io/${{ github.repository }}-assessment-worker-py
  ASSESSMENT_INFERENCE_IMAGE: ghcr.io/${{ github.repository }}-assessment-inference
  DB_IMAGE: ghcr.io/${{ github.repository }}-postgres
  # Bump this together with the pgvector version in docker/postgres/Dockerfile.
  # A database image should change rarely and on purpose: it is the one artefact
  # here that cannot be rolled back, because the data volume outlives it.
  DB_IMAGE_TAG: 16.4-pgvector0.8.6

jobs:
  # workflow_dispatch lets an operator pick any ref, so the branch filter above
  # is not enough on its own. Fail loudly and early instead of shipping a
  # feature branch to production.
  guard:
    name: Only phuc_v2026 may deploy
    runs-on: ubuntu-latest
    steps:
      - name: Check the ref being deployed
        run: |
          if [ "${GITHUB_REF}" != "refs/heads/phuc_v2026" ]; then
            echo "::error::This workflow deploys phuc_v2026 only (got ${GITHUB_REF}). Merge your work into phuc_v2026 first."
            exit 1
          fi
          echo "Deploying ${GITHUB_REF}."

  quality-gate:
    name: Quality gate
    needs: guard
    uses: ./.github/workflows/ci.yml

  build-and-push:
    name: Build and push backend image
    needs: quality-gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
            ${{ env.BACKEND_IMAGE }}:latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build and push assessment worker
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.assessment-worker
          push: true
          tags: |
            ${{ env.ASSESSMENT_WORKER_IMAGE }}:${{ github.sha }}
            ${{ env.ASSESSMENT_WORKER_IMAGE }}:latest
          cache-from: type=gha,scope=assessment-worker
          cache-to: type=gha,mode=max,scope=assessment-worker

      # Build context is the repo root: the image ships docs/assessment/contracts.
      - name: Build and push assessment python worker
        uses: docker/build-push-action@v6
        with:
          context: .
          file: assessment-worker/Dockerfile
          push: true
          tags: |
            ${{ env.ASSESSMENT_WORKER_PY_IMAGE }}:${{ github.sha }}
            ${{ env.ASSESSMENT_WORKER_PY_IMAGE }}:latest
          cache-from: type=gha,scope=assessment-worker-py
          cache-to: type=gha,mode=max,scope=assessment-worker-py

      - name: Build and push assessment inference
        uses: docker/build-push-action@v6
        with:
          context: ./assessment-inference
          push: true
          tags: |
            ${{ env.ASSESSMENT_INFERENCE_IMAGE }}:${{ github.sha }}
            ${{ env.ASSESSMENT_INFERENCE_IMAGE }}:latest
          cache-from: type=gha,scope=assessment-inference
          cache-to: type=gha,mode=max,scope=assessment-inference

  # Its own job and its own cache scope: this image has nothing to do with the
  # backend build, and mixing the two caches would make each invalidate the other.
  build-and-push-db:
    name: Build and push database image
    needs: guard
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Rebuilt on every deploy rather than on Dockerfile changes only: the build
      # is cached, and a conditional would leave the deploy pulling a tag that a
      # package cleanup may have removed.
      - name: Build and push database
        uses: docker/build-push-action@v6
        with:
          context: docker/postgres
          file: docker/postgres/Dockerfile
          push: true
          tags: ${{ env.DB_IMAGE }}:${{ env.DB_IMAGE_TAG }}
          cache-from: type=gha,scope=postgres
          cache-to: type=gha,mode=max,scope=postgres

  deploy:
    name: Deploy backend to VPS
    needs: [build-and-push, build-and-push-db]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    environment:
      name: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Copy production compose
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "docker-compose.prod.yml,scripts/retain-docker-images.py"
          target: ${{ secrets.VPS_APP_DIR }}

      - name: Deploy services
        uses: appleboy/ssh-action@v1.2.0
        env:
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BACKEND_IMAGE: ${{ env.BACKEND_IMAGE }}
          ASSESSMENT_WORKER_IMAGE: ${{ env.ASSESSMENT_WORKER_IMAGE }}
          ASSESSMENT_WORKER_PY_IMAGE: ${{ env.ASSESSMENT_WORKER_PY_IMAGE }}
          ASSESSMENT_INFERENCE_IMAGE: ${{ env.ASSESSMENT_INFERENCE_IMAGE }}
          DB_IMAGE: ${{ env.DB_IMAGE }}
          DB_IMAGE_TAG: ${{ env.DB_IMAGE_TAG }}
          IMAGE_TAG: ${{ github.sha }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: GHCR_USERNAME,GHCR_TOKEN,BACKEND_IMAGE,ASSESSMENT_WORKER_IMAGE,ASSESSMENT_WORKER_PY_IMAGE,ASSESSMENT_INFERENCE_IMAGE,DB_IMAGE,DB_IMAGE_TAG,IMAGE_TAG
          script: |
            set -euo pipefail
            cd "${{ secrets.VPS_APP_DIR }}"
            test -f .env.prod

            previous_tag=""
            if [ -f .last-backend-tag ]; then
              previous_tag="$(cat .last-backend-tag)"
            fi

            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin
            export BACKEND_IMAGE ASSESSMENT_WORKER_IMAGE ASSESSMENT_WORKER_PY_IMAGE ASSESSMENT_INFERENCE_IMAGE DB_IMAGE DB_IMAGE_TAG IMAGE_TAG
            # Outbound grading requires release-specific manual authorization.
            # Stop any previous gateway before deploying a new worker.
            docker compose -f docker-compose.prod.yml --env-file .env.prod \
              --profile assessment-external stop assessment-external-grading
            assessment_enabled=$(docker compose -f docker-compose.prod.yml --env-file .env.prod config --format json | python3 -c 'import json,sys; print(str(json.load(sys.stdin)["services"]["backend"]["environment"].get("ASSESSMENT_ENABLED", "false")).lower())')
            if [ "$assessment_enabled" = "true" ]; then
              export COMPOSE_PROFILES=assessment
              docker compose -f docker-compose.prod.yml --env-file .env.prod pull assessment-worker assessment-worker-py assessment-inference
            else
              docker compose -f docker-compose.prod.yml --env-file .env.prod --profile assessment stop assessment-worker assessment-worker-py assessment-inference || true
            fi
            docker compose -f docker-compose.prod.yml --env-file .env.prod pull db backend

            # Recreate the database BEFORE migrating. A migration can need a
            # server-side capability the running image does not have -- 189 needs
            # pgvector -- and the migration step below only replaces the *client*,
            # so it would otherwise run against the old server binary and fail.
            # The volume is untouched: the container is replaced, not the data.
            # When the image is unchanged this is a no-op.
            docker compose -f docker-compose.prod.yml --env-file .env.prod up -d db

            wait_for_db() {
              for _ in $(seq 1 30); do
                if docker compose -f docker-compose.prod.yml --env-file .env.prod \
                  exec -T db sh -c 'pg_isready -q -U "$POSTGRES_USER" -d "$POSTGRES_DB"'; then
                  return 0
                fi
                sleep 2
              done
              echo "Database did not become ready after recreating it." >&2
              return 1
            }

            # `run --rm --no-deps` ignores depends_on, so the healthcheck that
            # normally gates the backend does not gate migrations.
            wait_for_db

            db_psql() {
              docker compose -f docker-compose.prod.yml --env-file .env.prod exec -T db \
                sh -c 'psql -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" -tA'
            }

            # This database predates TypeORM's migration history: its schema was
            # built outside the migration runner, so `migrations` is empty and the
            # runner replays from 1700000000000, dying on a column that already
            # exists. Record the pre-school migrations as applied once -- they are
            # already reflected in the schema -- so the runner applies only what is
            # genuinely new. Guarded on an empty history AND a schema probe, so it
            # cannot fire against a database that does not need it.
            baseline_migrations() {
              db_psql <<'SQL'
            CREATE TABLE IF NOT EXISTS "migrations" (
              "id" SERIAL NOT NULL,
              "timestamp" bigint NOT NULL,
              "name" character varying NOT NULL,
              CONSTRAINT "PK_8c82d7f526340ab734260ea46be" PRIMARY KEY ("id")
            );
            SQL

              local applied
              applied="$(db_psql <<'SQL' | tr -d '[:space:]'
            SELECT count(*) FROM "migrations";
            SQL
            )"
              if [ "$applied" != "0" ]; then
                echo "Migration history already present ($applied rows); skipping baseline."
                return 0
              fi

              local probe
              probe="$(db_psql <<'SQL' | tr -d '[:space:]'
            SELECT to_regclass('public.auth_login_attempts') IS NOT NULL;
            SQL
            )"
              if [ "$probe" != "t" ]; then
                echo "Refusing to baseline: no auth_login_attempts table, so this schema is older than migration 1830000000000 and baselining would hide real work." >&2
                return 1
              fi

              echo "Empty migration history on an existing schema; baselining migrations up to 1830000000000."
              db_psql <<'SQL'
            INSERT INTO "migrations" ("timestamp", "name") VALUES
              (1700000000000, 'AddPhoneToUsers1700000000000'),
              (1770000000000, 'AddFlashcardSchema1770000000000'),
              (1770000000001, 'AddTopicToFlashcardDecks1770000000001'),
              (1770000000002, 'AddQuizSchema1770000000002'),
              (1770000000003, 'AddDescriptionToFlashcards1770000000003'),
              (1780000000000, 'AddQuizSessionQuestionOrder1780000000000'),
              (1780000000001, 'AddDailyLearningTasks1780000000001'),
              (1790000000000, 'AddRefreshTokenSessionMetadata1790000000000'),
              (1800000000000, 'AddEducationPlatformApis1800000000000'),
              (1800000000001, 'AddLeaderboardAggregateIndexes1800000000001'),
              (1810000000000, 'AddAiTutorConversations1810000000000'),
              (1820000000000, 'AddAiSystemRules1820000000000'),
              (1830000000000, 'AddAuthLoginAttempts1830000000000')
            ON CONFLICT DO NOTHING;
            SQL
            }

            baseline_migrations

            # Apply pending migrations with the newly built image while the old
            # backend is still serving. The app does not run migrations on boot
            # (no migrationsRun), so without this the new code meets an old schema.
            # Migrations are additive, so a rollback never reverts them.
            docker compose -f docker-compose.prod.yml --env-file .env.prod run --rm -T --no-deps backend npm run migration:run:prod

            docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --remove-orphans db backend
            docker compose -f docker-compose.prod.yml --env-file .env.prod restart frontend || true

            wait_healthy() {
              for _ in $(seq 1 30); do
                # 8090, not 8080: the frontend container is published on 8090 because
                # 8080 on this VPS belongs to another project.
                curl --fail --show-error --silent http://127.0.0.1:8090/api/health && return 0
                sleep 5
              done
              return 1
            }

            rollback() {
              if [ -z "$previous_tag" ]; then
                echo "Health check failed and no previous tag exists for rollback." >&2
                docker compose -f docker-compose.prod.yml --env-file .env.prod ps
                exit 1
              fi

              echo "Health check failed. Rolling back to $previous_tag." >&2
              # The failed container is about to be replaced, taking its logs with
              # it. Print them first, or the next diagnosis starts from nothing.
              docker compose -f docker-compose.prod.yml --env-file .env.prod ps >&2 || true
              docker compose -f docker-compose.prod.yml --env-file .env.prod \
                logs --no-color --tail 200 backend >&2 || true
              export IMAGE_TAG="$previous_tag"
              docker compose -f docker-compose.prod.yml --env-file .env.prod pull backend
              docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --remove-orphans backend
              docker compose -f docker-compose.prod.yml --env-file .env.prod restart frontend || true
              wait_healthy
              exit 1
            }

            wait_healthy || rollback

            if [ "$assessment_enabled" = "true" ]; then
              assessment_up() {
                docker compose -f docker-compose.prod.yml --env-file .env.prod \
                  up -d --no-build --wait --wait-timeout 150 assessment-redis assessment-inference assessment-worker assessment-worker-py
              }
              if ! assessment_up; then
                echo "Assessment services failed readiness; restoring the previous API." >&2
                docker compose -f docker-compose.prod.yml --env-file .env.prod \
                  stop assessment-worker assessment-worker-py assessment-inference || true
                if [ -n "$previous_tag" ]; then
                  export IMAGE_TAG="$previous_tag"
                  docker compose -f docker-compose.prod.yml --env-file .env.prod pull backend
                  docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --no-build backend
                  docker compose -f docker-compose.prod.yml --env-file .env.prod restart frontend || true
                  wait_healthy
                  # A release before the Python split may not have a python
                  # worker or inference image.
                  if docker compose -f docker-compose.prod.yml --env-file .env.prod \
                    pull assessment-worker assessment-worker-py assessment-inference && assessment_up; then
                    echo "Restored assessment services from the previous release."
                  else
                    docker compose -f docker-compose.prod.yml --env-file .env.prod \
                      stop assessment-worker assessment-worker-py assessment-inference || true
                    echo "Assessment workers are stopped. Queued work remains in PostgreSQL and Redis." >&2
                  fi
                fi
                exit 1
              fi
            fi

            printf '%s' "$IMAGE_TAG" > .last-backend-tag
            python3 scripts/retain-docker-images.py --keep 3 "$BACKEND_IMAGE" "$ASSESSMENT_WORKER_IMAGE" "$ASSESSMENT_WORKER_PY_IMAGE" "$ASSESSMENT_INFERENCE_IMAGE" "$DB_IMAGE"
            docker compose -f docker-compose.prod.yml --env-file .env.prod ps
